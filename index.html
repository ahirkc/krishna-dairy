<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176b45">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>KRISHNA DAIRY MARMI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f5f7f6;
    }
    body {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    #app-frame {
      display: block;
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      margin: 0;
      padding: 0;
      background: #fff;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
    }
    #load-error {
      display: none;
      padding: 20px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #8a1c1c;
    }
  </style>
</head>
<body>
  <iframe
    id="app-frame"
    title="KRISHNA DAIRY MARMI"
    allow="clipboard-read; clipboard-write"
    loading="eager"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <div id="load-error">
    ऐप का लिंक नहीं मिला। कृपया GitHub में config.js खोलकर जाँचें कि
    window.DAIRY_APP_URL में आपका Google Apps Script Web App URL मौजूद है।
  </div>

  <script src="./config.js"></script>
  <script>
    (function () {
      var frame = document.getElementById('app-frame');
      var url = window.DAIRY_APP_URL;
      if (typeof url === 'string' && /^https:\/\//i.test(url)) {
        frame.src = url;
      } else {
        frame.style.display = 'none';
        document.getElementById('load-error').style.display = 'block';
      }
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
